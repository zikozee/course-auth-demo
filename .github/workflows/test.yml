name: authorization server test pipeline

on:
  push:
    branches: [feature/ci-cd]

jobs:
  build-job-section:
    runs-on: ubuntu-latest
    environment: test

    services:
      postgres:
        image: 'postgres:18'
        env:
          POSTGRES_DB: auth_demo
          POSTGRES_PASSWORD: ${{ secrets.DB_PASS }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      - run: mvn clean -B -U package

      - name: list all file
        run: ls target/*

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: authorization-artifact
          path: |
            target/*.jar
            Dockerfile
          overwrite: 'true'
          retention-days: 1

  build-and-push-image:
    name: Build and push
    runs-on: ubuntu-latest
    needs:
      build-job-section
#    outputs:
#      image_name: ${{  }}
    steps:

      - name: download artifact
        uses: actions/download-artifact@v8
        with:
          name: authorization-artifact

      - name: list all file
        run: ls
